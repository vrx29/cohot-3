<!doctype html>
<html>
  <head>
    <script>
      let globalId = 1;
      let todoState = [];
      let oldTodoState = [];

      function addTodoToDom(todo) {
        const parent = document.getElementById("todos");

        const child = document.createElement("div");
        child.setAttribute("id", todo.id);

        const title = document.createElement("div");
        title.innerText = todo.title;

        const description = document.createElement("div");
        description.innerText = todo.description;

        const button = document.createElement("button");
        button.setAttribute("onclick", `removeTodo(${todo.id})`);
        button.innerText = "Delete";

        child.appendChild(title);
        child.appendChild(description);
        child.appendChild(button);

        parent.appendChild(child);
      }

      function removeTodoFromDom(todo) {
        const el = document.getElementById(todo.id);
        if (el) {
          el.remove();
        }
      }

      function updateTodoInDom(oldTodo, newTodo) {
        const el = document.getElementById(newTodo.id);

        if (!el) return;

        el.children[0].innerText = newTodo.title;
        el.children[1].innerText = newTodo.description;
      }

      function updateState(newTodos) {
        // calculate the diff b/w newTodos and oldTodos.
        // More specifically, find out what todos are -
        // 1. added
        // 2. deleted
        // 3. updated
        const added = [];
        const deleted = [];
        const updated = [];
        // calculate these 3 arrays
        // call addTodo, removeTodo, updateTodo functions on each of the
        // elements
        if (newTodos.length > oldTodoState.length) {
          newTodos.forEach((newEl) => {
            let found = false;
            oldTodoState.forEach((oldEl) => {
              if (oldEl.id == newEl.id) {
                found = true;
                if (
                  newEl.title !== oldEl.title ||
                  newEl.description !== oldEl.description
                ) {
                  updated.push({ oldTodo: oldEl, newTodo: newEl });
                }
              }
            });
            if (!found) {
              added.push(newEl);
            }
          });
        } else if (newTodos.length < oldTodoState.length) {
          oldTodoState.forEach((oldEl) => {
            let found = false;
            newTodos.forEach((newEl) => {
              if (oldEl.id == newEl.id) {
                found = true;
              }
            });
            if (!found) {
              deleted.push(oldEl);
            }
          });
        }

        added.forEach((todo) => addTodoToDom(todo));
        deleted.forEach((todo) => removeTodoFromDom(todo));
        oldTodoState = JSON.parse(JSON.stringify(newTodos));
      }

      function addTodo() {
        const title = document.getElementById("title").value;
        const description = document.getElementById("description").value;
        todoState.push({
          title: title,
          description: description,
          id: globalId++,
        });
        updateState(todoState);
      }

      function removeTodo(id) {
        todoState = todoState.filter((t) => t.id !== id);
        updateState(todoState);
      }
    </script>
  </head>

  <body>
    <input type="text" id="title" placeholder="Todo title" /><br /><br />
    <input type="text" id="description" placeholder="Todo description" />
    <br /><br />
    <button onclick="addTodo()">Add todo</button>
    <br />
    <br />

    <div id="todos"></div>
  </body>
</html>
